name: 'Test CI'

on:
  pull_request:

permissions:
  contents: read
  checks: write
  
env:
  DOTNET_CORE_VERSION: 8.0.x

jobs:
  run-tests:
    name: run tests
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Restore NuGet Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('src/MyWorkID.Server') }}
      - name: Setup .NET Core
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: ${{ env.DOTNET_CORE_VERSION }}
      - name: Build
        run: |
          dotnet restore
          dotnet build --configuration Release --no-restore
      - name: Test
        run: |
          dotnet test --logger "trx;logfilename=testResults.trx"
      - name: Gather Test Results
        if: success() || failure()
        run: |
          mkdir TestResults
          cp tests/MyWorkID.Server.IntegrationTests/TestResults/testResults.trx TestResults/Integration-Tests.trx
          cp tests/MyWorkID.Server.UnitTests/TestResults/testResults.trx TestResults/Unit-Tests.trx
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: success() || failure()
        with:
          name: testResults
          path: TestResults/*.trx
